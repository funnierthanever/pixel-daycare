name: PixelDaycare
options:
  bundleIdPrefix: com.pixeldaycare
  deploymentTarget:
    iOS: "17.0"
targets:
  PixelDaycare:
    type: application
    platform: iOS
    sources:
      - path: PixelDaycare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixeldaycare.app
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Daycare
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    postCompileScripts:
      - name: Bundle the daycare
        basedOnDependencyAnalysis: false
        script: |
          # Copies the web app from the folder above into the app, so every build has the latest version.
          SRC="${PROJECT_DIR}/.."
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/web"
          mkdir -p "$DEST/js"
          cp "$SRC/index.html" "$SRC/icon.png" "$DEST/"
          rsync -a --delete "$SRC/js/" "$DEST/js/"
          mkdir -p "$DEST/assets"
          rsync -a --delete "$SRC/assets/" "$DEST/assets/"
